<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo Class Example</title>
    <link rel="stylesheet" href="PseudoStyle.css">
</head>
<body>
    <h1>1 :hover & active</h1>
    <button>Hover / Click Me</button>
    <h1>2 :focus</h1>
    <input type="text" placeholder="Click to focus">
    <h1>3 :link & :visited</h1>
    <a href="https://khdiamond.net/" target="_blank">Go to warch Movie</a>
    <h1>4 :first-child /:last-child /:nth-child</h1>
    <ul>
        <li>Item 1 (first-child)</li>
        <li>Item 2 (nth-child)</li>
        <li>Item 3 (last-child)</li>
    </ul>
    <h1>5 :checked</h1>
    <input type="checkbox"> Accept Terms
    <h1>6 :disabled</h1>
    <input type="text" disabled value="Disabled input">
</body>
</html>
