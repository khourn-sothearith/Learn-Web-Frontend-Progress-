<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <div class="card">
            <div class="image">
                <div class="icon1">
                    <i class="fa-regular fa-heart" style="color:rgb(158, 6, 6);"></i>
                </div>    
                <img src="./Card_Spiderman.png" alt="Image_Spiderman">
            </div>
            <div class="discription">
                <div class="star">
                    <i class="fa-solid fa-heart"></i>
                    <i class="fa-solid fa-heart"></i>
                    <i class="fa-solid fa-heart"></i>
                    <i class="fa-solid fa-heart"></i>
                    <i class="fa-regular fa-heart"></i>
                    <p>(12.3K)</p>
                </div>
                <div class="title">
                    <div class="spiderman">
                        <p>SPIDER-MAN:</p>
                        <p>DRAND NEW DAY</p>
                    </div>
                    <p class="year">2026</p>
                </div>
                <div class="paragraph">
                    <p>genre ACTION SCIENCE-FICTION</p>
                    <p>directed byDESTIN DANIEL CRETTON</p>
                    <p>produced byKEVIN FEIGE AMY PASCAL</p><br>
                    <p>starring TOM HOLLAND ZENDAYA MARK RUFFALO JON BERNTHAL SADIE SINK</p>
                </div>
                <div class="btn">
                    <button>Read More</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
