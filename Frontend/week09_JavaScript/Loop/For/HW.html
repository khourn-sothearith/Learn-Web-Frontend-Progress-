<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-2">JavaScript Tasks</h1>
        <h3 class="text-center mb-4">Number of n: <span id="Numn"></span></h3>
        <div id="loop"></div>
    </div>

    <script>
        let n;
        let out;
        let result = "";

        n = Number(prompt("Enter Number n: "));
        out = document.getElementById("loop");
        document.getElementById("Numn").innerHTML = n;

        // Task 1
        result += "<div class='mb-3'>";
        result += "<b>Task 1:</b> ";

        for (let i = -2; i <= 6; i += 2) {
            result += i + " ";
        }
        result += "</div>";

        // Task 2
        result += "<div class='mb-3'>";
        result += "<b>Task 2:</b> ";

        for (let i = 2; i <= n; i += 2) {
            result += i + " ";
        }
        result += "</div>";

        // Task 3
        result += "<div class='mb-3'>";
        result += "<b>Task 3:</b> ";

        for (let i = 10; i >= -n; i -= 10) {
            result += i + " ";
        }
        result += "</div>";

        // Task 4
        result += "<div class='mb-3'>";
        result += "<b>Task 4:</b> ";

        for (let i = 1; i <= n; i++) {
            if (i % 2 != 0) {
                result += i + " ";
            }
        }
        result += "</div>";

        // Task 5
        result += "<div class='mb-3'>";
        result += "<b>Task 5:</b> ";

        for (let i = 50; i >= n; i -= 3) {
            if (i % 2 == 0) {
                result += i + " ";
            }
        }
        result += "</div>";

        // Task 6
        result += "<div class='mb-3'>";
        result += "<b>Task 6:</b> ";

        for (let i = 10; i <= n; i++) {
            if (i % 2 != 0) {
                result += i * 2 + " ";
            }
        }
        result += "</div>";

        // Task 7
        let sum7 = 0;

        result += "<div class='mb-3'>";
        result += "<b>Task 7:</b> ";

        for (let i = 2; i <= n; i += 2) {
            sum7 += i;
            result += i;
            if (i + 2 <= n) {
                result += " + ";
            }
        }
        result += " = " + sum7;
        result += "</div>";

        // Task 8
        let sum8 = 0;

        result += "<div class='mb-3'>";
        result += "<b>Task 8:</b> ";

        for (let i = 0; i <= n; i += 30) {
            sum8 += Math.cos(i * Math.PI / 180);
            result += "cos(" + i + ")";
            if (i + 30 <= n) {
                result += " + ";
            }
        }
        result += " = " + sum8.toFixed(2);
        result += "</div>";

        // Task 9
        let sub9 = 50;

        result += "<div class='mb-3'>";
        result += "<b>Task 9:</b> 10";

        for (let i = 49; i >= n; i--) {
            sub9 -= i;
            result += " - " + i;
        }
        result += " = " + sub9;
        result += "</div>";

        // Task 10
        let sum10 = 0;

        result += "<div class='mb-3'>";
        result += "<b>Task 10:</b> ";

        for (let i = 120; i >= n; i -= 30) {
            sum10 += Math.sin(i * Math.PI / 180);
            result += "sin(" + i + ")";
            if (i - 30 >= n) {
                result += " + ";
            }
        }
        result += " = " + sum10.toFixed(2);
        result += "</div>";

        // Task 11
        let sum11 = 0;

        result += "<div class='mb-3'>";
        result += "<b>Task 11:</b> ";

        for (let i = 1; i <= n; i += 2) {
            sum11 += i * i;
            result += i + " x " + i;
            if (i + 2 <= n) {
                result += " + ";
            }
        }
        result += " = " + sum11;
        result += "</div>";

        // Display result
        out.innerHTML = result;
    </script>
</body>
</html>
