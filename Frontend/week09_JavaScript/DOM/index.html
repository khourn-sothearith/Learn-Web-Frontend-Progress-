<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <form class="form rounded-5 shadow-lg mt-5 p-4 w-75 m-auto" id="employeeForm">
            <h2 class="text-center">Employee Form</h2>
            <div class="row">
                <div class="col col-lg-6">
                    <label class="form-label">ID</label>
                    <input class="form-control" type="text" id="id">
                </div>
                <div class="col col-lg-6">
                    <label class="form-label">Name</label>
                    <input class="form-control" type="text" id="name">
                </div>
            </div>
            <div class="row">
                <div class="col col-lg-6">
                    <label class="form-label">Catagory</label>
                    <input class="form-control" type="text" id="catagory">
                </div>
                <div class="col col-lg-6">
                    <label class="form-label">Brand</label>
                    <input class="form-control" type="text" id="brand">
                </div>
            </div>
            <div class="row">
                <div class="col col-lg-6">
                    <label class="form-label">Price</label>
                    <input class="form-control" type="number" id="price">
                </div>
                <div class="col col-lg-6">
                    <label class="form-label">Quantity</label>
                    <input class="form-control" type="number" id="quantity">
                </div>
            </div>
            <button class="btn btn-success mt-4" type="submit">Submit</button>
        </form>
        
        <h3>Output:</h3>
        <table class="table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Gatagoryr</th>
                    <th>Brand</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Total Price</th>
                    <th>Discound</th>
                    <th>Payment</th>
                </tr>
            </thead>
            <tbody id="output">
                
            </tbody>
        </table>
    </div>

    <script>
        let discound;
        let total_price;
        let discount;
        let payment;

        const form = document.getElementById("employeeForm");
        const output = document.getElementById("output");

        form.addEventListener("submit", function(e) {
            e.preventDefault(); // stop page reload
            const id = document.getElementById("id").value;
            const name = document.getElementById("name").value;
            const catagory = document.getElementById("catagory").value;
            const brand = document.getElementById("brand").value;
            const price = document.getElementById("price").value;
            const quantity = document.getElementById("quantity").value;

            total_price = price*quantity;
            
            if(total_price <= 100){
                discount = 10;
            }else if(total_price > 100){
                discount = 20;
            }else {
                discount = 0;
            }
            
            payment = total_price - (total_price * discount) / 100;
            
            // output.innerHTML = `ID: ${id} <br> Name: ${name} <br> Catagory: ${catagory} <br> Brand: ${brand} <br>
            //     Price: ${price} <br> Quantity: ${quantity} <br> Discount: ${discount} <br> Total Price: ${total_price} <br>
            //     Payment: ${payment}
            // `;
            output.innerHTML = `
                <tr>
                    <td>${id}</td>
                    <td>${name}</td>
                    <td>${catagory}</td>
                    <td>${brand}</td>
                    <td>${price}</td>
                    <td>${quantity}</td>
                    <td>${total_price.toFixed(2)}</td>
                    <td>${discount.toFixed(2)}</td>
                    <td>${payment.toFixed(2)}</td>
                </tr>
            `;
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
