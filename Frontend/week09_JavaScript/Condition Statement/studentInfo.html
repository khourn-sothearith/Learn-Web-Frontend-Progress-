<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container text-center">
        <h2>Student Information</h2>
        <table class="table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Gender</th>
                    <th>Total_Score</th>
                    <th>Everage</th>
                    <th>Grade</th>
                </tr>
            </thead>
            <tbody id="body_info">
    
            </tbody>
        </table>
    </div>

    <script>
        let id;
        let name, gender;
        let score1, score2, score3, score4, score5;
        let total_score, everage;
        let grade;

        id = prompt("Enter ID : ");
        name = prompt("Enter Name : ");
        gender = prompt("Enter Gender : ");

        score1 = Number(prompt("Enter Score 1: "));
        score2 = Number(prompt("Enter Score 2: "));
        score3 = Number(prompt("Enter Score 3: "));
        score4 = Number(prompt("Enter Score 4: "));
        score5 = Number(prompt("Enter Score 5: "));

        total_score = score1 + score2 + score3 + score4 + score5;
        everage = total_score/5;

        if(everage >= 90){
            grade = "A";
        }else if(everage >= 80){
            grade = "B";
        }else if(everage >= 70){
            grade = "C";
        }else if(everage >= 60){
            grade = "D";
        }else if(everage >= 50){
            grade = "E";
        }else{
            grade = "F";
        }

        document.getElementById("body_info").innerHTML = 
            `<tr>
                <th>${id}</th>
                <th>${name}</th>
                <th>${gender}</th>
                <th>${total_score.toFixed(2)}</th>
                <th>${everage.toFixed(2)}</th>
                <th>${grade}</th>
            </tr>`;
        

        // document.write("----Student Score---- </br>");
        // document.write("ID : " + id + "</br>");
        // document.write("Name : " + name + "</br>");
        // document.write("Gender : " + gender + "</br>");
        // document.write("Score 1 : " + score1 + "</br>");
        // document.write("Score 2 : " + score2 + "</br>");
        // document.write("Score 3 : " + score3 + "</br>");
        // document.write("Score 4 : " + score4 + "</br>");
        // document.write("Score 5 : " + score5 + "</br>");
        // document.write("--> Total Score : " + total_score + "</br>");
        // document.write("--> Everage : " + everage + "</br>");
        // document.write("--> Grade : " + grade);

    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
