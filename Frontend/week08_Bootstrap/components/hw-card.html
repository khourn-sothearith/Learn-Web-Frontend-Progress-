<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.13.1/font/bootstrap-icons.min.css" integrity="sha512-t7Few9xlddEmgd3oKZQahkNI4dS6l80+eGEzFQiqtyVYdvcSG2D3Iub77R20BdotfRPA9caaRkg1tyaJiPmO0g==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="container d-flex justify-content-center">
        <div class="row">
            <!--  -->
            <div class="col-12 col-lg-6 g-3">
                <div class="card rounded-2 shadow-lg mt-5 position-relative" style="height: 500px; width: 300px;">
                    <span class="badge bg-danger position-absolute top-0 start-0 m-2">10% OFF</span>
                    <div class="p-1 h-75">
                        <img class="w-100 h-100 object-fit-cover rounded-2" src="https://i.pinimg.com/736x/e8/fe/fb/e8fefb1d16429c442001a2eb313c0c36.jpg" alt="">
                    </div>
                    <div class=" card-body text-center">
                        <div class=" fw-bold ">
                            <p>KOPI KITA COFFE.</p>
                            <div>
                                <i class="bi bi-star-fill" style="color:goldenrod"></i>
                                <i class="bi bi-star-fill" style="color:goldenrod"></i>
                                <i class="bi bi-star-fill" style="color:goldenrod"></i>
                                <i class="bi bi-star-fill" style="color:goldenrod"></i>
                                <i class="bi bi-star-half" style="color:goldenrod"></i>
                            </div>
                            <p>65.00$ <i class="bi bi-cart3"></i></p>
                        </div>
                    </div>
                </div>
            </div>
            <!--  -->
            <div class="col-12 col-lg-6 g-3">
                <div class="card rounded-2 shadow-lg mt-5 position-relative" style="height: 500px; width: 300px;">
                    <span class="badge bg-danger position-absolute top-0 start-0 m-2">NEW</span>
                    <div class="p-1 h-75">
                        <img class="w-100 h-100 object-fit-cover rounded-2" src="https://i.pinimg.com/736x/46/5c/5e/465c5ed14e778a6fb2196739c9a3e7b9.jpg" alt="">
                    </div>
                    <div class=" card-body">
                        <div class=" fw-bold">
                            <p>Nescafe Caramel Macchiato: Bold Coffee with Smooth Sweetness</p>
                        </div>
                        <div class="fw-bold d-flex justify-content-between align-items-center">
                            <span>$65.00 <span class=" text-decoration-line-through text-secondary">$95.00</span></span>
                            <button class="btn bg-primary text-light px-5">order</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
