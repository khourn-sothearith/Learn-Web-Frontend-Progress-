<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container d-flex justify-content-end mt-lg-5">
        <!-- Button trigger modal -->
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">
            Add new Class
        </button>
    
        <!-- Modal -->
        <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content" style="width: 700px;">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="exampleModalLabel">Add new class</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form>
                            <div class="row">
                                <div class="col-lg-4">
                                    <label for="" class="form-label">Course</label>
                                    <select class="form-select">
                                        <option selected disabled>Select Course</option>
                                        <option>Frontend Web Development</option>
                                        <option>Backend Web Development</option>
                                        <option>Full-Stack Web Development</option>
                                    </select>
                                </div>
                                <div class="col-lg-4">
                                    <label for="" class="form-label">Lession</label>
                                    <select class="form-select">
                                        <option selected disabled>Select Lession</option>
                                        <option>Frontend Web Development</option>
                                        <option>Backend Web Development</option>
                                        <option>Full-Stack Web Development</option>
                                    </select>
                                </div>
                                <div class="col-lg-4">
                                    <label for="" class="form-label">Status</label>
                                    <select class="form-select">
                                        <option selected disabled>Select Status</option>
                                        <option>Frontend Web Development</option>
                                        <option>Backend Web Development</option>
                                        <option>Full-Stack Web Development</option>
                                    </select>
                                </div>
                            </div>

                            <div class="row mt-3">
                                <div class="col-lg-4">
                                    <label for="" class="form-label">Time</label>
                                    <select class="form-select">
                                        <option selected disabled>Select Time</option>
                                        <option>Frontend Web Development</option>
                                        <option>Backend Web Development</option>
                                        <option>Full-Stack Web Development</option>
                                    </select>
                                </div>
                                <div class="col-lg-4">
                                    <label for="" class="form-label">Room</label>
                                    <select class="form-select">
                                        <option selected disabled>Select Room</option>
                                        <option>Frontend Web Development</option>
                                        <option>Backend Web Development</option>
                                        <option>Full-Stack Web Development</option>
                                    </select>
                                </div>
                                <div class="col-lg-4">
                                    <label for="" class="form-label">Status</label>
                                    <select class="form-select">
                                        <option selected disabled>Select Status</option>
                                        <option>Frontend Web Development</option>
                                        <option>Backend Web Development</option>
                                        <option>Full-Stack Web Development</option>
                                    </select>
                                </div>
                            </div>
                            <div class="row mt-3">
                                <div class="col-lg-6">
                                    <label for="" class="form-label">Day</label>
                                    <select class="form-select">
                                        <option selected disabled>Mon-Fri</option>
                                        <option>Sat-Sun</option>
                                    </select>
                                </div>
                                <div class="col-lg-6">
                                    <label for="" class="form-label">Teacher</label>
                                    <select class="form-select">
                                        <option selected disabled>Select Teacher</option>
                                        <option>Frontend Web Development</option>
                                        <option>Backend Web Development</option>
                                        <option>Full-Stack Web Development</option>
                                    </select>
                                </div>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Concel</button>
                        <button type="button" class="btn btn-primary">Add Class</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
