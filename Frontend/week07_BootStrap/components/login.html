<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
    <div class=" container d-flex align-items-center justify-content-center">
        <form class=" w-25 mt-5 shadow-lg py-5 px-3 rounded-3 shadow-lg">
            <h1 class=" fw-bold text-center">Login here</h1>
            <div class=" pt-3">
                <label for="email" class=" form-label">Email</label>
                <input type="email" class=" form-control">
            </div>
            <div class=" pt-3">
                <label for="password" class=" form-label">Email</label>
                <input type="password" class=" form-control">
            </div>
            <div class=" pt-3">
                <label for="role" class=" form-label">Select your personality</label>
                <select type="role" class=" form-select">
                    <option value="1">Smos</option>
                    <option value="2">Sava</option>
                    <option value="3">I'm gay</option>
                </select>
            </div>
            <div class=" pt-5 text-center">
                <button class="w-100 btn btn-light py-2 px-5 bg-primary text-light">Login</button>
            </div>
        </form>
    </div>
    
</body>
</html>
