<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class=" container-fluid bg-dark w-100" style="height: 40px;">
        <div class="row p-2">
            <div class=" col-12 text-light fw-bold">
                <p>MakeForms</p>
            </div>
        </div>
        <div class=" container p-4">
            <div class=" row pb-4">
                <div class=" col-12 " style="font-family: 'Roboto', 'Open Sans', Arial, sans-serif;">
                    <h4 class=" fw-bold">Let's Chat. <br>Tell me about your project</h4>
                </div>
            </div>

            <div class="row">
                <div class=" col-6">
                    <label for="" class=" form-label fw-semibold">Full Name<span class=" text-danger">*</span></label>
                    <input type="text" class=" form-control border-black" placeholder="Enter your full name">
                </div>
                <div class=" col-6">
                    <label for="" class=" form-label fw-semibold">Email address<span class=" text-danger">*</span></label>
                    <input type="text" class=" form-control border-black" placeholder="name@example.com">
                </div>
            </div>

            <div class="row">
                <div class=" col-12 py-3">
                    <label for="" class=" form-label fw-semibold">Contact No.<span class=" text-danger">*</span></label>
                    <div class=" input-group border border-black rounded-3">
                        <select class=" form-select" style=" max-width:100px">
                            <option value="+91">(+91)</option>
                            <option value="+855">(+855)</option>
                            <option value="+1">(+1)</option>
                        </select>
                        <input type="tel" class=" form-control" placeholder="123 456 789">
                    </div>
                </div>
            </div>

            <div class="row">
                <div class=" col-12 py-3">
                    <label for="address" class=" form-label fw-semibold">Address<span class=" text-danger">*</span></label>
                    <textarea name="address" id="address" class=" form-control pt-4 border-black" placeholder="Enter your address" maxlength="100"></textarea>
                </div>
            </div>

            <div class="row">
                <label for="" class=" form-label fw-semibold">Where is your company based?</label>
                <div class=" col-6 pb-3">
                    <select class="form-select border-black">
                        <option selected disabled>Select your country</option>
                        <option>Cambodia</option>
                        <option>Laos</option>
                        <option>Vietnam</option>
                    </select>
                </div>
                <div class=" col-6 pb-3">
                    <input type="text" class=" form-control border-black" placeholder="State">
                </div>
                <div class=" col-6 py-3">
                    <input type="text" class=" form-control border-black" placeholder="City">
                </div>
                <div class=" col-6 py-3">
                    <input type="text" class=" form-control border-black" placeholder="Zip-code">
                </div>
            </div>

            <div class="row">
                <div class=" col-12 py-3">
                    <label for="" class=" form-label fw-semibold">Date picker<span class=" text-danger">*</span></label>
                    <input type="date" id="" class=" form-control border-black" placeholder="DD-MM-YYY">
                </div>
            </div>

            <div class="row">
                <div class=" col-12 py-3">
                    <label for="" class=" form-label fw-semibold">Time picker<span class=" text-danger">*</span></label>
                    <input type="time" class=" form-control border-black" placeholder="DD-MM-YYY">
                </div>
            </div>

            <div class="row">
                <label for="" class=" form-label fw-semibold mt-3">Where is your company based?</label>
                <div class=" col-12 pb-3 mb-5">
                    <select class="form-select border-black">
                        <option selected disabled>Are you gay?</option>
                        <option>1. I'm gay</option>
                        <option>2. Yes 1</option>
                        <option>3. No 1</option>
                    </select>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
