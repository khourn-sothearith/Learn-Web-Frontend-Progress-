<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <style>
        body{
            width: 100%;
            height: 100vh;
            background-image: url("https://i.pinimg.com/1200x/55/72/ba/5572ba3676f1dc95773e5359339d9d91.jpg");
            background-repeat:no-repeat;
            background-size: cover;
        }
    </style>
</head>
<body>
    <div class=" container w-50 pt-5">
        <form action="" class=" bg-light shadow-lg mt-5 pt-4 px-5 rounded-3 shadow-lg border">
            <div class="row text-center pb-4">
                <div class=" col-12">
                    <h1>Powering world-class Companies</h1>
                </div>
            </div>
            
            <div class="row pb-4">
                <div class=" col-lg-6">
                    <div>
                        <label for="" class=" form-label">Frist Name</label>
                        <input type="text" class=" form-control" placeholder="Enter your first name">
                    </div>
                </div>
                <div class=" col-lg-6">
                    <div>
                        <label for="" class=" form-label">Last Name</label>
                        <input type="text" class=" form-control" placeholder="Enter your last name">
                    </div>
                </div>
            </div>

            <div class="row pb-4">
                <div class=" col-lg-6">
                    <div>
                        <label for="" class=" form-label">Busines Email</label>
                        <input type="email" class=" form-control" placeholder="Enter your email">
                    </div>
                </div>
                <div class=" col-lg-6">
                    <div>
                        <label for="" class=" form-label">Phone number</label>
                        <input type="text" class=" form-control" placeholder="Enter your phone">
                    </div>
                </div>
            </div>

            <div class="row pb-4">
                <div class=" col-lg-6">
                    <div>
                        <label for="" class=" form-label">Job title</label>
                        <input type="text" class=" form-control" placeholder="Enter your job title">
                    </div>
                </div>
            </div>

            <div class="row pb-4">
                <div class=" col-lg-12">
                    <label for="" class=" form-label">What would you be using flink?</label>
                    <input type="text" class=" form-control " placeholder="Enter your answer">
                </div>
            </div>

            <div class="row pb-4">
                <div class="col-lg-12 d-flex justify-content-end">
                    <button class="btn text-uppercase w-50 bg-primary text-light">request a demo</button>
                </div>
            </div>
        </form>
    </div>
</body>
</html>
