<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
        }
        .box {
            height: 60px;
        }
        .content {
            height: 200px;
        }
        .section {
            height: 100px;
        }
        .footer {
            height: 80px;
        }
    </style>
</head>
<body>
    <div class="container bg-info">
        <div class="mx-lg-4 mx-md-2 mx-2">
            <div class="row g-1 mb-lg-4 mb-md-3 mb-2">
                <div class="col-12 col-lg-6">
                    <div class=" bg-danger box">
                        Header
                    </div>
                </div>
                <div class="col-12 col-lg-6">
                    <div class=" bg-danger box">
                        Header
                    </div>
                </div>
            </div>
            <div class="row g-1 mb-lg-4 mb-md-3 mb-2">
                <div class="col-12">
                    <div class=" bg-success content">
                        Content
                    </div>        
                </div>
            </div>
            <div class="row g-1 mb-lg-4 mb-md-3 mb-2">
                <div class=" col-12 col-lg-4">
                    <div class=" bg-primary section">
                        Section
                    </div>
                </div>
                <div class=" col-12 col-lg-4">
                    <div class=" bg-primary section">
                        Section
                    </div>
                </div>
                <div class=" col-12 col-lg-4">
                    <div class=" bg-primary section">
                        Section
                    </div>
                </div>
            </div>
            <div class="row g-1 mb-lg-4 mb-md-3 mb-2">
                <div class="col-12 col-md-6 col-lg-3">
                    <div class=" bg-secondary footer">
                        footer
                    </div>
                </div>
                <div class="col-12 col-md-6 col-lg-3">
                    <div class=" bg-secondary footer">
                        footer
                    </div>
                </div>
                <div class="col-12 col-md-6 col-lg-3">
                    <div class=" bg-secondary footer">
                        footer
                    </div>
                </div>
                <div class="col-12 col-md-6 col-lg-3">
                    <div class=" bg-secondary footer">
                        footer
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
