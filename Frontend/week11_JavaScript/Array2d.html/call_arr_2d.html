<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Array 2D</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="container mt-5">
    <script>
        let array = [
            [33, 55, 66, 77, 22, 90],
            [77, 66, 55, 23, 77, 22],
            [66, 76, 22, 56, 66, 77],
            [86, 75, 64, 86, 93, 85],
            [85, 75, 94, 63, 64, 90]    
        ];

        for(let i = 1; i <= 4; i++){
            let j = i + 1;
            document.write(array[i][j] + ", ");
        }
        document.write("</br>");

        //task-1: 75, 64, 56, 77, 99
        document.write("Task 1: ");
        for(let i = 4; i >= 0; i--){
            let j = 5 - i;
            document.write(array[i][j] + ", ");
        }
        document.write("</br>");

        //task-2: 75, 22, 23, 22
        document.write("Task 2: ");
        for(let i = 3; i >= 0; i--){
            let j = 4 - i;
            document.write(array[i][j] + ", ");
        }
        document.write("</br>");

        //task-3: 90, 85, 77, 22, 90
        document.write("Task 3: ");
        for(let i = 4; i >= 0; i--){
            document.write(array[i][5] + ", ");
        }
        document.write("</br>");

        //task-4: 33, 55, 66
        document.write("Task 4: ");
        for(let i = 0; i <= 2; i++){
            let j = i * 2;
            document.write(array[i][j] + ", ");
        }
        document.write("</br>");

        //task-5: 33, 76, 94
        document.write("Task 5: ");
        for(let i = 0; i <= 4; i+=2){
            let j = i / 2;
            document.write(array[i][j] + ", ");
        }
        document.write("</br>");

        //task-6: 90, 66, 77
        document.write("Task 6: ");
        for(let i = 4; i >= 0; i-=2){
            // i = 4 2 0
            // j = 5 4 3
        let j = (i / 2) + 3;
            document.write(array[i][j] + ", ");
        }
        document.write("</br>");
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
